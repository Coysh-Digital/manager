# Redis for cache, queues and the connector replay-nonce store.
#
# Written by hand rather than pulled in as a ddev add-on: the official add-on requires a newer ddev
# than this machine runs, and a dozen lines of compose has no version constraint to trip over.
#
# The service is called manager-redis, not redis, and that matters. ddev attaches custom services to
# the shared ddev_default network as well as the project's own, so a service named "redis" takes the
# "redis" DNS alias on a network every other ddev project is also on. With a plain name, this
# project silently reached another project's Redis — including while its own was stopped, which made
# a fail-closed check appear to pass. A project-scoped name removes the ambiguity.
#
# Persistence is deliberately off. Locally this holds nonces and cache entries, both of which are
# meant to be ephemeral, and it makes the fail-closed behaviour easy to exercise:
#
#   docker stop ddev-manager-redis    # connector requests must now be rejected, not accepted
services:
  manager-redis:
    container_name: ddev-${DDEV_SITENAME}-redis
    image: redis:8-alpine
    restart: "no"
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    expose:
      - "6379"
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: $DDEV_APPROOT
