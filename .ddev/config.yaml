name: manager
type: laravel
docroot: public
php_version: "8.4"
webserver_type: nginx-fpm
xdebug_enabled: false
nodejs_version: "22"
corepack_enable: false
composer_version: "2"

# Postgres and Redis here mirror what the shipped Docker Compose deployment runs, so local
# behaviour matches what a self-hosted customer gets.
database:
  type: postgres
  version: "17"

# Mutagen stays on here. It is deliberately off in the Craft testbed, where the connector is
# symlinked in from outside the project root.
mutagen_enabled: true

use_dns_when_possible: true
router_http_port: "80"
router_https_port: "443"

# Pin the *host* ports.
#
# The two settings above are the router's ports inside Docker. Without the three below, ddev picks
# ephemeral host ports and reassigns them on every restart — so anything pointed at 127.0.0.1 from
# outside breaks silently the next time the project is restarted for an unrelated reason.
#
# That is not hypothetical: an ngrok tunnel forwarding to this project returned 502 for every
# request — including a live site's connector heartbeats — after a restart moved the port from 54747
# to 63205, with nothing to indicate why. A database client pointed at the db port has the same
# failure mode, so that is pinned too.
#
# Pick anything free and high. These are the values the tunnel was already using.
host_webserver_port: "54747"
host_https_port: "54748"
host_db_port: "54749"

hooks:
  post-start:
    - exec: |
        cd /var/www/html
        [ -f .env ] || cp .env.example .env
        setenv() {
          if grep -qE "^#?[[:space:]]*$1=" .env; then
            sed -i -E "s|^#?[[:space:]]*$1=.*|$1=$2|" .env
          else
            printf '%s=%s\n' "$1" "$2" >> .env
          fi
        }
        setenv APP_URL https://manager.ddev.site
        setenv DB_CONNECTION pgsql
        setenv DB_HOST db
        setenv DB_PORT 5432
        setenv DB_DATABASE db
        setenv DB_USERNAME db
        setenv DB_PASSWORD db
        setenv REDIS_CLIENT predis
        setenv REDIS_HOST manager-redis
        setenv REDIS_PORT 6379
        setenv CACHE_STORE redis
        setenv QUEUE_CONNECTION redis
        setenv SESSION_DRIVER database
        grep -q "^APP_KEY=base64:" .env || php artisan key:generate --ansi
