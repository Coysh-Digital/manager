# Make the sibling manager-protocol checkout reachable inside the container.
#
# Composer installs the package as a symlink at vendor/coysh-digital/manager-protocol, pointing at
# ../../../protocol — which resolves to /var/www/protocol in here. ddev only mounts the project
# directory, so without this the symlink would dangle and the class would not load.
#
# Mutagen is configured with symlink mode "posix-raw", so it passes the link through verbatim
# rather than trying to resolve or rewrite it.
#
# The payoff is that editing ../protocol/src takes effect immediately, with no composer step.
# Continuous integration and the production image install the same package from its repository
# instead, so neither depends on this mount.
services:
  web:
    volumes:
      - ../../protocol:/var/www/protocol
