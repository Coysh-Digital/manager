name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to the commit behind a release rather than to a tag. A tag can be moved; a commit
# cannot. This workflow runs on pull requests from anybody, so what executes here should not be something
# a third party can change under us.

jobs:
  test:
    name: Tests and analysis
    runs-on: ubuntu-latest

    services:
      # Postgres, not SQLite. The audit log depends on a trigger and on revoked table privileges,
      # so testing against another engine would test something other than what ships.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: db_test
          POSTGRES_USER: db
          POSTGRES_PASSWORD: db
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['5432:5432']

      # Exercised for real. Faking it would hide the fail-closed behaviour that replay protection
      # turns on.
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['6379:6379']

    env:
      DB_HOST: 127.0.0.1
      DB_DATABASE: db_test
      DB_USERNAME: db
      DB_PASSWORD: db
      REDIS_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, zip, sodium, redis
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      # Run first and reported separately, so a security regression is never buried in ordinary
      # test output.
      - name: Security invariants
        run: vendor/bin/pest --testsuite=Invariants

      - name: Full test suite
        run: vendor/bin/pest

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: sodium
          coverage: none

      - run: composer install --no-interaction --no-progress --prefer-dist

      # Advisories fail the build. Abandonment is reported but does not, because the two are
      # different claims: an advisory says a dependency is known to be exploitable, whereas
      # abandonment says nobody has promised to fix the next one. The second is a reason to plan a
      # migration, not a reason to block a deploy of code that has not changed.
      - name: Dependency advisories
        run: composer audit --locked --abandoned=report

      # The binary, not gitleaks/gitleaks-action. The action requires a paid licence for repositories
      # owned by an organisation; the tool it wraps is MIT and free. Running it directly also removes a
      # third-party action from a workflow that executes on pull requests from strangers.
      - name: Secret scanning
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

          # The whole history, not just the diff. A secret committed and later removed is still a
          # secret that was published, and this repository is public.
          /tmp/gitleaks git . --redact --verbose --exit-code 1

      # The compiled assets are committed, because the shipped image carries no Node toolchain. That
      # only works if they match the source, so this asserts it: a change to CSS or JS without a
      # rebuild fails here rather than shipping an image whose pages render against stale assets.
      - name: Compiled assets match the source
        run: |
          npm ci

          # The counterpart to `composer audit` above, and it exists because its absence let a
          # high-severity advisory sit in this tree. The documentation toolchain pulled a vulnerable
          # esbuild through an older Vite; none of it ever shipped, since the Dockerfile removes the
          # whole toolchain and public/build is committed, but a security product should not carry one
          # to build a documentation site. VitePress now has its own manifest under docs/.
          npm audit --audit-level=high

          npm run build
          git diff --exit-code -- public/build \
            || { echo "public/build is out of date. Run 'npm run build' and commit the result."; exit 1; }

      # The plugin registers a namespaced Composer command and installs no vendor/bin entry, so the
      # binary this used to invoke has never existed. That was a second failure stacked behind the
      # allow-plugins one in composer.json, and behind both sat a third: the assets check above
      # fails first, so neither of these had ever been reached to be noticed.
      - name: Software bill of materials
        run: |
          composer require --dev --no-interaction --no-progress cyclonedx/cyclonedx-php-composer
          composer CycloneDX:make-sbom --output-file=sbom.json --output-format=JSON

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: docker build -f deploy/docker/Dockerfile -t manager:ci .

      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: manager:ci
          format: table
          # Fails on anything fixable at high severity. Unfixed findings are reported but do not
          # block, since there is nothing a deploy can do about them.
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
