name: docs

# Builds the documentation site and publishes it as a release asset the marketing host pulls.
#
# The docs are served from managerforcraft.com/docs so that search authority stays on one hostname,
# but they are written here, in the repository they document. Those two facts have to be reconciled
# somewhere, and this is the seam: CI builds, attaches a tarball plus its checksum to a rolling
# `docs-latest` release, and the marketing deploy script fetches and verifies it.
#
# The alternative would have been to install Node on the marketing server and build there. That
# server deliberately has no Node toolchain, which is the whole reason its compiled assets are
# committed, and adding one to render markdown would be a poor trade.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # lastUpdated reads the git log for each file. Without full history every page claims to
          # have been updated on the day CI ran.
          fetch-depth: 0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          # The documentation toolchain has its own manifest. VitePress pins an older Vite than the
          # application uses, which pulled a vulnerable esbuild into every install in the repository
          # and produced a peer conflict that would only worsen; it now lives under docs/ so the
          # application's own tree audits clean.
          cache-dependency-path: docs/package-lock.json

      # The application's dependencies are not needed here - this builds markdown, not the app.
      - run: npm ci
        working-directory: docs

      # ignoreDeadLinks is false, so a broken cross-reference fails here rather than shipping.
      - run: npm run build
        working-directory: docs

      - name: Package
        run: |
          set -euo pipefail
          tar -czf docs-site.tar.gz -C docs/.vitepress/dist .
          sha256sum docs-site.tar.gz > docs-site.tar.gz.sha256
          cat docs-site.tar.gz.sha256

      # A rolling tag rather than a versioned release: the docs describe main, and pinning them to a
      # platform version would mean a documentation typo needing a release to reach anyone.
      #
      # --latest=false because this is a rolling build, not a release. `gh release create` marks
      # whatever it creates as Latest by default, so without it the first documentation change after
      # a version is tagged replaces that version as the Latest badge on the repository homepage —
      # and a visitor looking for what to install is shown "Documentation build" instead.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete docs-latest --yes --cleanup-tag || true
          gh release create docs-latest \
            --title "Documentation build" \
            --notes "Static build of docs/, published to managerforcraft.com/docs. Rolling: replaced on every change to the documentation." \
            --latest=false \
            docs-site.tar.gz docs-site.tar.gz.sha256
