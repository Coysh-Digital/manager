name: Advisories

# The dependency audit already runs on every pull request. This is the schedule, and the difference
# is the whole point of the file: an advisory is published when it is published, not when somebody
# next happens to open a pull request. A repository nobody has touched for three weeks was three
# weeks behind on knowing.
#
# Deliberately not a `schedule:` added to ci.yml. That would run the whole suite - Postgres, Redis,
# static analysis, a browser build - weekly, to answer a question that needs none of it, and a red
# run would then mean any of a dozen things. This job fails for exactly one reason.
#
# GitHub emails the repository owner when a scheduled workflow fails, which is the alerting
# mechanism. Nothing else needs configuring for that to work.

on:
  schedule:
    # Monday morning, UTC. Early enough in the week that acting on it is not a Friday job.
    - cron: '0 7 * * 1'

  # So it can be run by hand while investigating, without waiting for Monday.
  workflow_dispatch:

permissions:
  contents: read

# Actions pinned to the commit behind a release rather than to a tag, matching ci.yml. A tag can be
# moved; a commit cannot.

jobs:
  advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none

      # --no-scripts, because nothing here needs the application booted and package discovery on a
      # scheduled run is surface for no benefit.
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: PHP advisories
        run: composer audit --locked --abandoned=report

      # The counterpart, and it exists because its absence once let a high-severity advisory sit in
      # this tree: the documentation toolchain pulled a vulnerable esbuild through an older Vite.
      - name: JavaScript advisories
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
