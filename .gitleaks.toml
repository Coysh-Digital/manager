# Secret scanning configuration.
#
# Extends the shipped rules rather than replacing them, so new rules arrive with new gitleaks versions.

[extend]
useDefault = true

[allowlist]
description = """
Known test fixtures.

Scoped to the literal values, deliberately not to paths. Allowlisting tests/ wholesale would be easier
and would also mean a real credential pasted into a test file — which is exactly how they get committed —
would never be flagged again.

Add a value here only after establishing it is a fixture. If the list starts growing, that is a signal
that fixtures are being invented ad hoc rather than reused.
"""

regexTarget = "match"

regexes = [
    # The password every authentication test signs in with. An xkcd reference, and the only reason it
    # trips the generic-api-key rule is that it has enough entropy to look like one.
    '''correct-horse-battery-staple-42''',
]
