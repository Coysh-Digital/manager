# nginx for the web role.
#
# Serves the built assets and hands everything else to php-fpm. Runs unprivileged on 8080, so no
# capability to bind a low port is needed.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Every path nginx writes to lives under /tmp, which is a tmpfs. The container root filesystem
    # is read-only, and the default locations under /var/lib/nginx are owned by root while nginx runs
    # unprivileged - so without these, nginx cannot start at all.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    access_log /dev/stdout combined;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Large enough for an inventory report, small enough that an oversized body is refused by nginx
    # before PHP is involved. The application caps payloads again itself.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Never announce the version: it tells an attacker which advisories to try.
    server_tokens off;

    server {
        listen 8080;
        server_name _;
        root /app/public;
        index index.php;

        charset utf-8;

        # Defence in depth. The application sets its own headers too, but a static asset served by
        # nginx never reaches the application.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Immutable because Vite fingerprints every filename.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # The one route that carries a database.
        #
        # `client_max_body_size 2m` above is right for every other request - an inventory report is
        # kilobytes, and refusing an oversized body at nginx rather than in PHP is the point of
        # setting it at all. It was also, until this block existed, applied to the artifact upload,
        # so this image refused any backup over two megabytes while documenting a two *gigabyte*
        # limit. The application's own ceiling is MANAGER_BACKUP_MAX_BYTES, checked in middleware
        # against Content-Length before a byte of the body is read; `0` here defers to it rather
        # than duplicating a number that would then have to be kept in step.
        #
        # The timeouts are the other half. An artifact of any size on a slow uplink takes longer
        # than the default sixty seconds, and the failure looks like a network fault rather than a
        # limit.
        location ~ ^/api/connector/v1/backups/[^/]+/content$ {
            client_max_body_size 0;
            client_body_timeout 3600s;
            proxy_request_buffering off;

            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_read_timeout 3600s;
            fastcgi_send_timeout 3600s;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_hide_header X-Powered-By;
            internal;
        }

        # Anything else ending in .php is not ours to run.
        location ~ \.php$ {
            return 404;
        }

        # Dotfiles are never served. .env living below the web root already prevents this; belt and
        # braces costs nothing.
        location ~ /\. {
            deny all;
        }
    }
}
