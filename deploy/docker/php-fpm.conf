[www]
listen = 127.0.0.1:9000

; Dynamic, because a control plane's traffic is bursty: mostly idle, then every connector in the
; fleet checking in at once.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; Recycled periodically as cheap insurance against a leak in any dependency.
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no
clear_env = no
