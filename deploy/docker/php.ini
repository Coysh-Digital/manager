; Production PHP settings.
;
; expose_php off so responses do not advertise the version, and display_errors off so a
; misconfiguration cannot leak a stack trace to a visitor. Laravel handles error display itself;
; this is the floor beneath it.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

memory_limit = 256M
max_execution_time = 60

; No PHP-level body limit, because the body limit that matters is nginx's and it is already set
; per-route — 2m everywhere except the artifact upload, which is uncapped and streamed.
;
; These two used to say 2M, and that was a bug this image shipped with. PHP refuses a request whose
; Content-Length exceeds post_max_size before any application code runs, and Laravel's
; ValidatePostSize applies it to a PUT exactly as to a POST — so nginx's carve-out for
; /api/connector/v1/backups/*/content was undone one layer down, and no artifact over 2 MB could be
; received however the platform's own ceiling was configured. Nothing exercised it: the suite tests
; the route, not the image.
;
; Zero means unlimited to PHP, and Laravel skips its own check when the value is not above zero.
; Nothing is read into memory at either limit — the upload is streamed to disk — so the protection
; being given up here is not the protection it appears to be. `manager:doctor` reports the effective
; number under "Upload path ceiling".
post_max_size = 0
upload_max_filesize = 0

; Opcache with timestamp validation off: the code in an image never changes, so checking is pure
; overhead. It also means a deployment is a new container, not a file swap, which is the intent.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

date.timezone = UTC
