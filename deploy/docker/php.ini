; Production PHP settings.
;
; expose_php off so responses do not advertise the version, and display_errors off so a
; misconfiguration cannot leak a stack trace to a visitor. Laravel handles error display itself;
; this is the floor beneath it.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

memory_limit = 256M
max_execution_time = 60
post_max_size = 2M
upload_max_filesize = 2M

; Opcache with timestamp validation off: the code in an image never changes, so checking is pure
; overhead. It also means a deployment is a new container, not a file swap, which is the intent.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

date.timezone = UTC
